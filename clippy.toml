# Clippy configuration (https://doc.rust-lang.org/clippy/configuration.html).
# This file tunes lint *parameters*; lint *levels* live in Cargo.toml
# ([workspace.lints], inherited by every crate via `[lints] workspace = true`).

# Minimum supported Rust version — pinned to current stable (1.98). Clippy
# suppresses lints whose suggested APIs are newer than this.
msrv = "1.98"

# The workspace denies the `unwrap_used` / `expect_used` / `panic` /
# `indexing_slicing` / `print_*` restriction lints in production code.
# These keys keep tests ergonomic — assertions and unwraps are fine there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
